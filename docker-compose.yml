# Docker Compose 配置
# 包含开发和生产两种环境配置

services:
  # --- 基础设施 ---

  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: llmwiki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - dev
      - prod

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    profiles:
      - dev
      - prod

  # ARQ Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python worker.py
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llmwiki
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # --- 应用 ---

  # 开发环境
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - MOCK_MODE=true
      - NODE_ENV=development
    env_file:
      - .env.docker
    profiles:
      - dev

  # 生产环境
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MOCK_MODE=false
      - NODE_ENV=production
    env_file:
      - .env.docker
    restart: unless-stopped
    profiles:
      - prod

  # FastAPI 后端开发环境
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MOCK_MODE=true
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llmwiki
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
      - postgres
    profiles:
      - dev

  # FastAPI 后端生产环境
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=false
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llmwiki
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    profiles:
      - prod

  # Nginx反向代理（生产环境可选）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app-prod
      - backend-prod
    profiles:
      - prod-nginx

volumes:
  pgdata:
  redisdata:
